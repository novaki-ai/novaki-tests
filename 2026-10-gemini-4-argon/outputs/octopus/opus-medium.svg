<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff9fb5"/>
      <stop offset="1" stop-color="#d9456e"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="100" r="50" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="90" rx="60" ry="22"/>
    <ellipse cx="190" cy="75" rx="40" ry="20"/>
    <ellipse cx="480" cy="60" rx="50" ry="18"/>
  </g>
  <rect y="540" width="800" height="60" fill="#7cc46b"/>
  <rect y="560" width="800" height="40" fill="#9a9a9a"/>
  <g stroke="#ffffff" stroke-width="5" stroke-dasharray="40 30">
    <line x1="0" y1="580" x2="800" y2="580"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="400" cy="562" rx="300" ry="10" fill="#000" opacity="0.15"/>

  <!-- Wheels -->
  <g fill="none" stroke="#222" stroke-width="12">
    <circle cx="220" cy="450" r="105"/>
    <circle cx="580" cy="450" r="105"/>
  </g>
  <g stroke="#888" stroke-width="2">
    <line x1="220" y1="350" x2="220" y2="550"/>
    <line x1="120" y1="450" x2="320" y2="450"/>
    <line x1="149" y1="379" x2="291" y2="521"/>
    <line x1="149" y1="521" x2="291" y2="379"/>
    <line x1="580" y1="350" x2="580" y2="550"/>
    <line x1="480" y1="450" x2="680" y2="450"/>
    <line x1="509" y1="379" x2="651" y2="521"/>
    <line x1="509" y1="521" x2="651" y2="379"/>
  </g>
  <circle cx="220" cy="450" r="10" fill="#555"/>
  <circle cx="580" cy="450" r="10" fill="#555"/>

  <!-- Frame -->
  <g stroke="#1f7ad1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="220" y1="450" x2="400" y2="450"/>
    <line x1="220" y1="450" x2="360" y2="310"/>
    <line x1="400" y1="450" x2="360" y2="310"/>
    <line x1="360" y1="310" x2="530" y2="300"/>
    <line x1="400" y1="450" x2="535" y2="320"/>
  </g>
  <line x1="530" y1="290" x2="580" y2="450" stroke="#555" stroke-width="10" stroke-linecap="round"/>
  <!-- Handlebar -->
  <path d="M525 290 L530 265 L570 255" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M330 300 Q360 290 390 302 L385 310 L338 310 Z" fill="#333"/>

  <!-- Chainring and cranks -->
  <circle cx="400" cy="450" r="22" fill="none" stroke="#444" stroke-width="5"/>
  <line x1="400" y1="450" x2="440" y2="490" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  <line x1="400" y1="450" x2="360" y2="410" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  <rect x="428" y="486" width="26" height="8" rx="2" fill="#222"/>
  <rect x="347" y="406" width="26" height="8" rx="2" fill="#222"/>
  <path d="M220 450 L400 428 M220 450 L400 472" stroke="#666" stroke-width="2" fill="none"/>

  <!-- Octopus tentacles (behind body) -->
  <g fill="none" stroke="url(#skin)" stroke-width="18" stroke-linecap="round">
    <!-- to handlebar -->
    <path d="M410 240 Q470 230 500 260 Q520 275 545 260"/>
    <path d="M400 255 Q460 270 495 280 Q520 285 535 270"/>
    <!-- to pedals -->
    <path d="M385 270 Q420 340 400 400 Q395 420 362 410"/>
    <path d="M370 275 Q440 380 445 485"/>
    <!-- waving -->
    <path d="M320 245 Q260 230 240 180 Q230 150 260 140"/>
    <path d="M335 265 Q280 300 250 290 Q225 280 230 260"/>
    <path d="M345 275 Q320 340 290 350 Q270 355 268 335"/>
    <path d="M355 278 Q350 340 330 380 Q320 400 300 395"/>
  </g>
  <!-- Suckers -->
  <g fill="#ffd3de">
    <circle cx="470" cy="238" r="4"/><circle cx="500" cy="262" r="4"/>
    <circle cx="455" cy="270" r="4"/><circle cx="490" cy="281" r="4"/>
    <circle cx="410" cy="340" r="4"/><circle cx="403" cy="380" r="4"/>
    <circle cx="430" cy="400" r="4"/><circle cx="442" cy="450" r="4"/>
    <circle cx="265" cy="220" r="4"/><circle cx="242" cy="180" r="4"/>
    <circle cx="275" cy="295" r="4"/><circle cx="245" cy="280" r="4"/>
    <circle cx="315" cy="335" r="4"/><circle cx="290" cy="350" r="4"/>
    <circle cx="345" cy="350" r="4"/><circle cx="325" cy="385" r="4"/>
  </g>

  <!-- Octopus head -->
  <ellipse cx="365" cy="200" rx="78" ry="88" fill="url(#skin)"/>
  <ellipse cx="340" cy="150" rx="18" ry="10" fill="#ffffff" opacity="0.35"/>
  <circle cx="400" cy="170" r="7" fill="#c23a62" opacity="0.6"/>
  <circle cx="320" cy="140" r="5" fill="#c23a62" opacity="0.6"/>

  <!-- Helmet -->
  <path d="M290 165 Q365 80 440 165 Q365 140 290 165 Z" fill="#ffcc00" stroke="#d19f00" stroke-width="3"/>
  <line x1="365" y1="105" x2="365" y2="150" stroke="#d19f00" stroke-width="3"/>

  <!-- Face -->
  <ellipse cx="345" cy="205" rx="16" ry="20" fill="#fff"/>
  <ellipse cx="395" cy="205" rx="16" ry="20" fill="#fff"/>
  <circle cx="351" cy="208" r="8" fill="#222"/>
  <circle cx="401" cy="208" r="8" fill="#222"/>
  <circle cx="354" cy="204" r="3" fill="#fff"/>
  <circle cx="404" cy="204" r="3" fill="#fff"/>
  <path d="M355 245 Q372 260 390 245" stroke="#7a1c38" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="325" cy="238" rx="10" ry="6" fill="#ff6b8e" opacity="0.6"/>
  <ellipse cx="415" cy="238" rx="10" ry="6" fill="#ff6b8e" opacity="0.6"/>

  <!-- Motion lines -->
  <g stroke="#5a8bb5" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="400" x2="100" y2="400"/>
    <line x1="40" y1="440" x2="95" y2="440"/>
    <line x1="60" y1="480" x2="100" y2="480"/>
  </g>
</svg>
