<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#cfeeff"/>
  <rect y="480" width="800" height="120" fill="#8bc66b"/>
  <rect y="505" width="800" height="12" fill="#6d6d6d" opacity="0.35"/>

  <!-- wheels -->
  <g fill="none" stroke="#222" stroke-width="8">
    <circle cx="240" cy="440" r="85"/>
    <circle cx="570" cy="440" r="85"/>
  </g>
  <g stroke="#888" stroke-width="2">
    <line x1="240" y1="355" x2="240" y2="525"/>
    <line x1="155" y1="440" x2="325" y2="440"/>
    <line x1="180" y1="380" x2="300" y2="500"/>
    <line x1="300" y1="380" x2="180" y2="500"/>
    <line x1="570" y1="355" x2="570" y2="525"/>
    <line x1="485" y1="440" x2="655" y2="440"/>
    <line x1="510" y1="380" x2="630" y2="500"/>
    <line x1="630" y1="380" x2="510" y2="500"/>
  </g>

  <!-- frame -->
  <g stroke="#d62828" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 440 L360 440 L320 340 L240 440"/>
    <path d="M360 440 L450 340 L320 340"/>
    <path d="M450 340 L570 440"/>
    <path d="M450 340 L440 300"/>
  </g>
  <!-- handlebar -->
  <path d="M440 300 L480 292" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <!-- seat -->
  <path d="M290 330 Q320 318 350 330" stroke="#222" stroke-width="12" fill="none" stroke-linecap="round"/>
  <line x1="320" y1="340" x2="320" y2="326" stroke="#222" stroke-width="6"/>
  <!-- pedal crank -->
  <circle cx="360" cy="440" r="14" fill="#444"/>
  <line x1="360" y1="440" x2="385" y2="470" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <rect x="373" y="468" width="28" height="9" rx="3" fill="#222"/>

  <!-- tentacles -->
  <g fill="none" stroke="#9b4dca" stroke-width="16" stroke-linecap="round">
    <path d="M330 270 Q250 280 220 330 Q200 360 230 370"/>
    <path d="M340 285 Q280 320 290 380 Q295 410 320 405"/>
    <path d="M375 285 Q385 360 375 425 Q372 460 385 470"/>
    <path d="M395 270 Q430 290 470 295"/>
    <path d="M410 255 Q480 240 500 270"/>
    <path d="M320 255 Q260 230 230 255"/>
    <path d="M350 290 Q330 350 345 400"/>
    <path d="M405 285 Q440 330 410 380"/>
  </g>
  <!-- suckers hint -->
  <g fill="#e2b6f5">
    <circle cx="240" cy="345" r="3"/><circle cx="285" cy="378" r="3"/><circle cx="380" cy="400" r="3"/>
  </g>

  <!-- head/mantle -->
  <ellipse cx="365" cy="190" rx="75" ry="85" fill="#b565df"/>
  <ellipse cx="365" cy="255" rx="70" ry="38" fill="#b565df"/>
  <circle cx="335" cy="170" r="8" fill="#d9a6f0" opacity="0.7"/>
  <circle cx="390" cy="150" r="6" fill="#d9a6f0" opacity="0.7"/>

  <!-- helmet -->
  <path d="M290 195 Q295 105 365 105 Q435 105 440 195 Q365 170 290 195Z" fill="#ffd60a" stroke="#c9a200" stroke-width="4"/>
  <path d="M365 105 L365 178" stroke="#c9a200" stroke-width="4"/>

  <!-- eyes -->
  <circle cx="337" cy="222" r="20" fill="#fff"/>
  <circle cx="393" cy="222" r="20" fill="#fff"/>
  <circle cx="343" cy="224" r="9" fill="#111"/>
  <circle cx="399" cy="224" r="9" fill="#111"/>
  <circle cx="346" cy="221" r="3" fill="#fff"/>
  <circle cx="402" cy="221" r="3" fill="#fff"/>
  <!-- smile -->
  <path d="M345 260 Q368 280 392 260" stroke="#5a1f7a" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
