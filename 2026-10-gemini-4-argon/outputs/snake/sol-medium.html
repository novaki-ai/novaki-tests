<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: #101827;
      color: #eef4ff;
      font-family: system-ui, sans-serif;
    }
    main {
      width: 960px;
      height: 540px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    header {
      width: 400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 26px; }
    #score { font-size: 20px; font-weight: bold; }
    .board { position: relative; width: 400px; height: 400px; }
    canvas {
      display: block;
      background: #162236;
      border-radius: 6px;
    }
    #message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(10, 16, 28, 0.8);
      text-align: center;
      border-radius: 6px;
      pointer-events: none;
    }
    #message[hidden] { display: none; }
    #message strong { font-size: 36px; }
    footer { font-size: 14px; color: #aebdd3; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Snake</h1>
      <div id="score" aria-live="polite">Score: 0</div>
    </header>
    <div class="board">
      <canvas id="board" width="400" height="400" aria-label="20 by 20 Snake game board"></canvas>
      <div id="message">
        <strong id="message-title">Snake</strong>
        <span id="message-detail">Press Space to start</span>
      </div>
    </div>
    <footer>Arrow keys to steer · Space to start or restart</footer>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 20;
      const CELL = 20;
      const STEP_MS = 150;
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreElement = document.getElementById("score");
      const message = document.getElementById("message");
      const messageTitle = document.getElementById("message-title");
      const messageDetail = document.getElementById("message-detail");

      const vectors = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      const opposite = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
      };
      const keyDirections = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right"
      };

      let body;
      let food;
      let dir;
      let pendingDir;
      let running = false;
      let gameOver = false;
      let score = 0;
      let timer = null;

      function placeFood() {
        const available = [];
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            if (!body.some(segment => segment.x === x && segment.y === y)) {
              available.push({ x, y });
            }
          }
        }
        if (available.length === 0) return false;
        food = available[Math.floor(Math.random() * available.length)];
        return true;
      }

      function reset() {
        clearInterval(timer);
        timer = null;
        running = false;
        gameOver = false;
        score = 0;
        dir = "right";
        pendingDir = "right";
        body = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        placeFood();
        scoreElement.textContent = "Score: 0";
        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#162236";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#223149";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= SIZE; i++) {
          const position = Math.min(i * CELL + 0.5, canvas.width - 0.5);
          ctx.moveTo(position, 0);
          ctx.lineTo(position, canvas.height);
          ctx.moveTo(0, position);
          ctx.lineTo(canvas.width, position);
        }
        ctx.stroke();

        ctx.fillStyle = "#ff637c";
        ctx.beginPath();
        ctx.arc(
          food.x * CELL + CELL / 2,
          food.y * CELL + CELL / 2,
          CELL * 0.35,
          0,
          Math.PI * 2
        );
        ctx.fill();

        body.forEach((segment, index) => {
          ctx.fillStyle = index === 0 ? "#adffbd" : "#4bdd8a";
          ctx.fillRect(
            segment.x * CELL + 2,
            segment.y * CELL + 2,
            CELL - 4,
            CELL - 4
          );
        });
      }

      function endGame() {
        running = false;
        gameOver = true;
        clearInterval(timer);
        timer = null;
        messageTitle.textContent = "Game Over";
        messageDetail.textContent = "Press Space to restart";
        message.hidden = false;
      }

      function tick() {
        if (!running) return;

        dir = pendingDir;
        const vector = vectors[dir];
        const next = {
          x: body[0].x + vector.x,
          y: body[0].y + vector.y
        };
        const eating = next.x === food.x && next.y === food.y;
        // The tail vacates its cell on a move that does not eat food.
        const occupied = eating ? body : body.slice(0, -1);

        if (
          next.x < 0 || next.x >= SIZE ||
          next.y < 0 || next.y >= SIZE ||
          occupied.some(segment => segment.x === next.x && segment.y === next.y)
        ) {
          endGame();
          return;
        }

        body.unshift(next);
        if (eating) {
          score += 10;
          scoreElement.textContent = `Score: ${score}`;
          if (!placeFood()) {
            draw();
            endGame();
            return;
          }
        } else {
          body.pop();
        }
        draw();
      }

      function start() {
        reset();
        running = true;
        message.hidden = true;
        timer = setInterval(tick, STEP_MS);
      }

      document.addEventListener("keydown", event => {
        if (event.code === "Space" || event.key === " ") {
          event.preventDefault();
          if (!running && !event.repeat) start();
          return;
        }

        const requested = keyDirections[event.key];
        if (!requested) return;
        event.preventDefault();
        if (running && requested !== opposite[dir]) {
          pendingDir = requested;
        }
      });

      window.snake = {
        state() {
          return {
            running,
            gameOver,
            score,
            length: body.length,
            head: { ...body[0] },
            food: { ...food },
            dir
          };
        },
        setFood(x, y) {
          if (
            !Number.isInteger(x) || !Number.isInteger(y) ||
            x < 0 || x >= SIZE || y < 0 || y >= SIZE
          ) {
            throw new RangeError("Food coordinates must be integers from 0 to 19.");
          }
          food = { x, y };
          draw();
        }
      };

      reset();
    })();
  </script>
</body>
</html>
