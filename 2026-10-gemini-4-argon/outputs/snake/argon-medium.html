<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 960px;
      height: 540px;
      background-color: #12121a;
      color: #f0f0f5;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    #hud {
      width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 700;
    }
    #score-container {
      background: #1e1e2c;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #33334d;
    }
    #score {
      color: #4ade80;
    }
    #board-wrapper {
      position: relative;
      width: 440px;
      height: 440px;
      border: 2px solid #33334d;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      background-color: #181824;
    }
    canvas {
      display: block;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(18, 18, 26, 0.78);
      text-align: center;
      pointer-events: none;
    }
    #overlay.hidden {
      display: none;
    }
    #status-text {
      font-size: 36px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    #sub-text {
      font-size: 16px;
      color: #a0a0b8;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>SNAKE</div>
    <div id="score-container">Score: <span id="score">0</span></div>
  </div>
  <div id="board-wrapper">
    <canvas id="gameCanvas" width="436" height="436"></canvas>
    <div id="overlay">
      <div id="status-text">Press Space to Start</div>
      <div id="sub-text">Use Arrow Keys to steer</div>
    </div>
  </div>

  <script>
    (function () {
      const GRID_SIZE = 20;
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const CELL_SIZE = canvas.width / GRID_SIZE;

      const scoreEl = document.getElementById('score');
      const overlayEl = document.getElementById('overlay');
      const statusTextEl = document.getElementById('status-text');
      const subTextEl = document.getElementById('sub-text');

      const TICK_MS = 150;

      const DIRS = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      const OPPOSITES = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };

      let snake = [];
      let dir = 'right';
      let inputQueue = [];
      let food = { x: 15, y: 10 };
      let score = 0;
      let running = false;
      let gameOver = false;
      let timerId = null;

      function initGame() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
        // Start length 3, moving right, centered vertically
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        dir = 'right';
        inputQueue = [];
        score = 0;
        running = false;
        gameOver = false;
        updateScoreUI();
        spawnFood();
        draw();
      }

      function updateScoreUI() {
        scoreEl.textContent = String(score);
      }

      function isOccupiedBySnake(x, y, ignoreTail = false) {
        const limit = ignoreTail ? snake.length - 1 : snake.length;
        for (let i = 0; i < limit; i++) {
          if (snake[i].x === x && snake[i].y === y) {
            return true;
          }
        }
        return false;
      }

      function spawnFood() {
        const available = [];
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            if (!isOccupiedBySnake(x, y)) {
              available.push({ x, y });
            }
          }
        }
        if (available.length > 0) {
          const idx = Math.floor(Math.random() * available.length);
          food = available[idx];
        }
      }

      function startGame() {
        if (gameOver) {
          initGame();
        }
        running = true;
        gameOver = false;
        overlayEl.classList.add('hidden');
        if (timerId !== null) clearInterval(timerId);
        timerId = setInterval(tick, TICK_MS);
        draw();
      }

      function endGame() {
        running = false;
        gameOver = true;
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
        statusTextEl.textContent = 'Game Over';
        subTextEl.textContent = 'Press Space to Restart';
        overlayEl.classList.remove('hidden');
        draw();
      }

      function tick() {
        if (!running || gameOver) return;

        if (inputQueue.length > 0) {
          const nextDir = inputQueue.shift();
          if (OPPOSITES[dir] !== nextDir) {
            dir = nextDir;
          }
        }

        const delta = DIRS[dir];
        const nextHead = {
          x: snake[0].x + delta.x,
          y: snake[0].y + delta.y
        };

        // Wall collision check
        if (
          nextHead.x < 0 ||
          nextHead.x >= GRID_SIZE ||
          nextHead.y < 0 ||
          nextHead.y >= GRID_SIZE
        ) {
          endGame();
          return;
        }

        const willEat = (nextHead.x === food.x && nextHead.y === food.y);

        // Self collision check (if not eating, the tail moves out of the way)
        if (isOccupiedBySnake(nextHead.x, nextHead.y, !willEat)) {
          endGame();
          return;
        }

        snake.unshift(nextHead);

        if (willEat) {
          score += 10;
          updateScoreUI();
          spawnFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw subtle grid
        ctx.strokeStyle = '#222232';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_SIZE; i++) {
          const pos = i * CELL_SIZE;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, canvas.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(canvas.width, pos);
          ctx.stroke();
        }

        // Draw food
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(
          (food.x + 0.5) * CELL_SIZE,
          (food.y + 0.5) * CELL_SIZE,
          CELL_SIZE * 0.4,
          0,
          Math.PI * 2
        );
        ctx.fill();

        // Draw snake
        for (let i = 0; i < snake.length; i++) {
          const seg = snake[i];
          ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
          const pad = 1.5;
          ctx.fillRect(
            seg.x * CELL_SIZE + pad,
            seg.y * CELL_SIZE + pad,
            CELL_SIZE - pad * 2,
            CELL_SIZE - pad * 2
          );
        }
      }

      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          if (!running) {
            startGame();
          }
          return;
        }

        const keyMap = {
          ArrowUp: 'up',
          ArrowDown: 'down',
          ArrowLeft: 'left',
          ArrowRight: 'right'
        };

        const requestedDir = keyMap[e.code] || keyMap[e.key];
        if (requestedDir) {
          e.preventDefault();
          if (!running || gameOver) return;

          const effectiveDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : dir;
          if (
            requestedDir !== effectiveDir &&
            OPPOSITES[effectiveDir] !== requestedDir &&
            inputQueue.length < 2
          ) {
            inputQueue.push(requestedDir);
          }
        }
      });

      window.snake = {
        state: function () {
          return {
            running: running,
            gameOver: gameOver,
            score: score,
            length: snake.length,
            head: { x: snake[0].x, y: snake[0].y },
            food: { x: food.x, y: food.y },
            dir: dir
          };
        },
        setFood: function (x, y) {
          food = { x: Number(x), y: Number(y) };
          draw();
        }
      };

      initGame();
    })();
  </script>
</body>
</html>
