<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 960px;
      height: 540px;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .header {
      width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: bold;
    }
    #score {
      color: #4ade80;
    }
    .board-container {
      position: relative;
      width: 440px;
      height: 440px;
      border: 2px solid #333;
      background-color: #1e1e1e;
    }
    canvas {
      display: block;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    #overlay.hidden {
      display: none;
    }
    #overlay-title {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #f87171;
    }
    #overlay-sub {
      font-size: 16px;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>SNAKE</div>
    <div>Score: <span id="score">0</span></div>
  </div>
  <div class="board-container">
    <canvas id="board" width="440" height="440"></canvas>
    <div id="overlay">
      <div id="overlay-title"></div>
      <div id="overlay-sub">Press Space to Start</div>
    </div>
  </div>

  <script>
    (function () {
      const GRID_SIZE = 20;
      const CELL_SIZE = 22; // 20 * 22 = 440px
      const TICK_MS = 150;

      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const overlayEl = document.getElementById('overlay');
      const overlayTitleEl = document.getElementById('overlay-title');
      const overlaySubEl = document.getElementById('overlay-sub');

      let snake = [];
      let dir = 'right';
      let nextDir = 'right';
      let food = { x: 15, y: 10 };
      let score = 0;
      let running = false;
      let gameOver = false;
      let timerId = null;

      const OPPOSITE = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };

      const DELTA = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };

      function initGame() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        // Start length 3, moving right, centered safely on the board
        snake = [
          { x: 6, y: 10 },
          { x: 5, y: 10 },
          { x: 4, y: 10 }
        ];
        dir = 'right';
        nextDir = 'right';
        score = 0;
        running = false;
        gameOver = false;
        updateScoreUI();
        spawnFood();
        render();
      }

      function updateScoreUI() {
        scoreEl.textContent = String(score);
      }

      function isOnSnake(x, y) {
        return snake.some(seg => seg.x === x && seg.y === y);
      }

      function spawnFood() {
        const freeCells = [];
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let x = 0; x < GRID_SIZE; x++) {
            if (!isOnSnake(x, y)) {
              freeCells.push({ x, y });
            }
          }
        }
        if (freeCells.length > 0) {
          const choice = freeCells[Math.floor(Math.random() * freeCells.length)];
          food = { x: choice.x, y: choice.y };
        }
      }

      function startGame() {
        if (gameOver) {
          initGame();
        }
        if (!running) {
          running = true;
          overlayEl.classList.add('hidden');
          overlayTitleEl.textContent = '';
          timerId = setInterval(tick, TICK_MS);
          render();
        }
      }

      function endGame() {
        running = false;
        gameOver = true;
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
        overlayTitleEl.textContent = 'Game Over';
        overlaySubEl.textContent = 'Press Space to Restart';
        overlayEl.classList.remove('hidden');
        render();
      }

      function tick() {
        if (!running || gameOver) return;

        dir = nextDir;
        const delta = DELTA[dir];
        const newHead = {
          x: snake[0].x + delta.x,
          y: snake[0].y + delta.y
        };

        // Wall collision check
        if (
          newHead.x < 0 ||
          newHead.x >= GRID_SIZE ||
          newHead.y < 0 ||
          newHead.y >= GRID_SIZE
        ) {
          endGame();
          return;
        }

        const eating = newHead.x === food.x && newHead.y === food.y;

        // Self collision check (ignore tail tip if not growing since it moves away)
        const checkSegments = eating ? snake : snake.slice(0, -1);
        if (checkSegments.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
          endGame();
          return;
        }

        snake.unshift(newHead);

        if (eating) {
          score += 10;
          updateScoreUI();
          spawnFood();
        } else {
          snake.pop();
        }

        render();
      }

      function render() {
        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw grid lines
        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID_SIZE; i++) {
          const pos = i * CELL_SIZE;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, canvas.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(canvas.width, pos);
          ctx.stroke();
        }

        // Draw food
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(
          food.x * CELL_SIZE + 2,
          food.y * CELL_SIZE + 2,
          CELL_SIZE - 4,
          CELL_SIZE - 4
        );

        // Draw snake
        snake.forEach((seg, index) => {
          ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e';
          ctx.fillRect(
            seg.x * CELL_SIZE + 1,
            seg.y * CELL_SIZE + 1,
            CELL_SIZE - 2,
            CELL_SIZE - 2
          );
        });

        // Also draw 'Game Over' on canvas when ended
        if (gameOver) {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
          e.preventDefault();
          if (!running) {
            startGame();
          }
          return;
        }

        const keyMap = {
          ArrowUp: 'up',
          ArrowDown: 'down',
          ArrowLeft: 'left',
          ArrowRight: 'right'
        };

        const requestedDir = keyMap[e.key] || keyMap[e.code];
        if (requestedDir) {
          e.preventDefault();
          // Prevent reversing directly into itself relative to the current active movement direction
          if (requestedDir !== OPPOSITE[dir]) {
            nextDir = requestedDir;
          }
        }
      });

      window.snake = {
        state() {
          return {
            running,
            gameOver,
            score,
            length: snake.length,
            head: { x: snake[0].x, y: snake[0].y },
            food: { x: food.x, y: food.y },
            dir
          };
        },
        setFood(x, y) {
          food = { x: Number(x), y: Number(y) };
          render();
        }
      };

      initGame();
    })();
  </script>
</body>
</html>
