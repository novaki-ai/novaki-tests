<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 960px;
    height: 540px;
    overflow: hidden;
    background: #111;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
  }
  #wrap {
    width: 960px;
    height: 540px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }
  #boardWrap {
    position: relative;
    width: 500px;
    height: 500px;
  }
  canvas {
    display: block;
    background: #1b1b1b;
    border: 2px solid #444;
    box-sizing: border-box;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    text-align: center;
  }
  #message {
    font-size: 44px;
    font-weight: bold;
    color: #ff5555;
    text-shadow: 0 2px 6px #000;
  }
  #hint {
    margin-top: 10px;
    font-size: 18px;
    color: #ddd;
    text-shadow: 0 1px 4px #000;
  }
  #side {
    width: 260px;
  }
  #side h1 {
    margin: 0 0 16px;
    font-size: 36px;
    color: #6c6;
  }
  .scoreLine {
    font-size: 28px;
    margin-bottom: 20px;
  }
  .help {
    font-size: 15px;
    line-height: 1.6;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="boardWrap">
    <canvas id="board" width="500" height="500"></canvas>
    <div id="overlay">
      <div id="message"></div>
      <div id="hint">Press Space to start</div>
    </div>
  </div>
  <div id="side">
    <h1>Snake</h1>
    <div class="scoreLine">Score: <span id="score">0</span></div>
    <div class="help">
      Space &mdash; start / restart<br>
      Arrow keys &mdash; steer<br>
      Eat food to grow (+10 points).<br>
      Avoid walls and your own tail.
    </div>
  </div>
</div>

<script>
(function () {
  var GRID = 20;
  var TICK_MS = 150;
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var CELL = canvas.width / GRID;
  var scoreEl = document.getElementById('score');
  var messageEl = document.getElementById('message');
  var hintEl = document.getElementById('hint');

  var VECTORS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 }
  };
  var OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };

  var snake, dir, dirQueue, food, score, running, gameOver, timer;

  function reset() {
    snake = [
      { x: 5, y: 10 },
      { x: 4, y: 10 },
      { x: 3, y: 10 }
    ];
    dir = 'right';
    dirQueue = [];
    score = 0;
    running = false;
    gameOver = false;
    stopTimer();
    placeFood();
    updateScore();
  }

  function occupied(x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (!occupied(x, y)) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function updateScore() {
    scoreEl.textContent = String(score);
  }

  function startTimer() {
    stopTimer();
    timer = setInterval(step, TICK_MS);
  }

  function stopTimer() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  function start() {
    if (gameOver) reset();
    running = true;
    messageEl.textContent = '';
    hintEl.textContent = '';
    startTimer();
    draw();
  }

  function endGame() {
    running = false;
    gameOver = true;
    stopTimer();
    messageEl.textContent = 'Game Over';
    hintEl.textContent = 'Press Space to restart';
    draw();
  }

  function step() {
    if (!running) return;

    if (dirQueue.length) dir = dirQueue.shift();
    var v = VECTORS[dir];
    var head = snake[0];
    var nx = head.x + v.x;
    var ny = head.y + v.y;

    if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) {
      endGame();
      return;
    }

    var eating = food && food.x === nx && food.y === ny;
    // The tail moves out of the way unless the snake is growing this tick.
    var checkLen = eating ? snake.length : snake.length - 1;
    for (var i = 0; i < checkLen; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        endGame();
        return;
      }
    }

    snake.unshift({ x: nx, y: ny });
    if (eating) {
      score += 10;
      updateScore();
      placeFood();
      if (!food) {
        endGame();
        return;
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function queueDirection(newDir) {
    var last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (newDir === last || newDir === OPPOSITE[last]) return;
    if (dirQueue.length < 3) dirQueue.push(newDir);
  }

  function draw() {
    ctx.fillStyle = '#1b1b1b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#262626';
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL + 0.5, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL + 0.5);
      ctx.lineTo(canvas.width, i * CELL + 0.5);
      ctx.stroke();
    }

    if (food) {
      ctx.fillStyle = '#e44';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }

    for (var j = snake.length - 1; j >= 0; j--) {
      var s = snake[j];
      ctx.fillStyle = j === 0 ? '#8f8' : '#4b4';
      ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
    }

    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff5555';
      ctx.font = 'bold 44px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 40);
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      if (!running) start();
      return;
    }
    var d = KEYS[e.key];
    if (d) {
      e.preventDefault();
      if (running) queueDirection(d);
    }
  });

  window.snake = {
    state: function () {
      var shownDir = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
      return {
        running: running,
        gameOver: gameOver,
        score: score,
        length: snake.length,
        head: { x: snake[0].x, y: snake[0].y },
        food: food ? { x: food.x, y: food.y } : null,
        dir: shownDir
      };
    },
    setFood: function (x, y) {
      x = Math.floor(Number(x));
      y = Math.floor(Number(y));
      if (!(x >= 0 && x < GRID && y >= 0 && y < GRID)) return false;
      food = { x: x, y: y };
      draw();
      return true;
    }
  };

  reset();
  draw();
})();
</script>
</body>
</html>
