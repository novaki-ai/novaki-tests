<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b1220;
    color: #eef4ff;
    font-family: system-ui, sans-serif;
  }
  main {
    width: 960px;
    height: 540px;
    padding: 30px;
    display: flex;
    align-items: center;
    gap: 48px;
  }
  .board { position: relative; width: 480px; height: 480px; }
  canvas {
    display: block;
    background: #111d30;
    border-radius: 8px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #0b1220c9;
    border-radius: 8px;
    pointer-events: none;
  }
  #overlay[hidden] { display: none; }
  #message { font-size: 38px; font-weight: 800; }
  #hint { margin-top: 12px; color: #bdcce2; }
  aside { flex: 1; }
  h1 { font-size: 52px; margin: 0 0 24px; }
  .label { color: #94a9c6; text-transform: uppercase; letter-spacing: 3px; }
  #score { font-size: 64px; font-weight: 750; color: #65edac; }
  p { color: #bdcce2; line-height: 1.7; }
  kbd {
    background: #20304a;
    padding: 3px 7px;
    border-radius: 4px;
    color: #fff;
  }
</style>
</head>
<body>
<main>
  <div class="board">
    <canvas id="board" width="480" height="480" aria-label="20 by 20 Snake game board"></canvas>
    <div id="overlay">
      <div id="message">Ready?</div>
      <div id="hint">Press Space to start</div>
    </div>
  </div>
  <aside>
    <h1>Snake</h1>
    <div class="label">Score</div>
    <div id="score" aria-live="polite">0</div>
    <p>Use the <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> keys to steer.</p>
    <p>Eat food for 10 points.<br>Avoid the walls and yourself.</p>
    <p><kbd>Space</kbd> starts or restarts.</p>
  </aside>
</main>
<script>
(() => {
  "use strict";

  const SIZE = 20;
  const CELL = 24;
  const STEP_MS = 150;
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreElement = document.getElementById("score");
  const overlay = document.getElementById("overlay");
  const message = document.getElementById("message");
  const hint = document.getElementById("hint");

  const vectors = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };
  const opposite = { up: "down", down: "up", left: "right", right: "left" };
  const keyDirections = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right"
  };

  let body;
  let food;
  let dir;
  let score;
  let running = false;
  let gameOver = false;
  let turnLocked = false;
  let timer = null;

  function reset() {
    body = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    food = { x: 15, y: 10 };
    dir = "right";
    score = 0;
    gameOver = false;
    turnLocked = false;
    scoreElement.textContent = "0";
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#1b2b43";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= SIZE; i++) {
      const p = i * CELL;
      ctx.moveTo(p, 0);
      ctx.lineTo(p, SIZE * CELL);
      ctx.moveTo(0, p);
      ctx.lineTo(SIZE * CELL, p);
    }
    ctx.stroke();

    ctx.fillStyle = "#ff7285";
    ctx.beginPath();
    ctx.arc(
      food.x * CELL + CELL / 2,
      food.y * CELL + CELL / 2,
      CELL * 0.34,
      0,
      Math.PI * 2
    );
    ctx.fill();

    body.forEach((segment, index) => {
      ctx.fillStyle = index === 0 ? "#a4ffd0" : "#43ce8b";
      ctx.fillRect(
        segment.x * CELL + 2,
        segment.y * CELL + 2,
        CELL - 4,
        CELL - 4
      );
    });
  }

  function endGame() {
    running = false;
    gameOver = true;
    clearInterval(timer);
    timer = null;
    message.textContent = "Game Over";
    hint.textContent = "Press Space to restart";
    overlay.hidden = false;
  }

  function placeRandomFood() {
    const empty = [];
    const occupied = new Set(body.map(segment => segment.y * SIZE + segment.x));
    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        if (!occupied.has(y * SIZE + x)) empty.push({ x, y });
      }
    }
    if (empty.length === 0) {
      endGame();
      return;
    }
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  function tick() {
    if (!running) return;

    const vector = vectors[dir];
    const next = { x: body[0].x + vector.x, y: body[0].y + vector.y };
    const eating = next.x === food.x && next.y === food.y;

    // The tail vacates its cell on a move that does not grow the snake.
    const collisionLength = body.length - (eating ? 0 : 1);
    const hitsBody = body.slice(0, collisionLength).some(
      segment => segment.x === next.x && segment.y === next.y
    );

    if (
      next.x < 0 || next.x >= SIZE ||
      next.y < 0 || next.y >= SIZE ||
      hitsBody
    ) {
      endGame();
      return;
    }

    body.unshift(next);
    if (eating) {
      score += 10;
      scoreElement.textContent = String(score);
      placeRandomFood();
    } else {
      body.pop();
    }

    turnLocked = false;
    draw();
  }

  function start() {
    clearInterval(timer);
    reset();
    running = true;
    overlay.hidden = true;
    draw();
    timer = setInterval(tick, STEP_MS);
  }

  document.addEventListener("keydown", event => {
    if (event.code === "Space" || event.key === " ") {
      event.preventDefault();
      if (!event.repeat && !running) start();
      return;
    }

    const requested = keyDirections[event.key];
    if (!requested) return;
    event.preventDefault();

    if (
      running &&
      !turnLocked &&
      requested !== dir &&
      requested !== opposite[dir]
    ) {
      dir = requested;
      // Accept at most one turn between moves to prevent indirect reversal.
      turnLocked = true;
    }
  });

  window.snake = {
    state() {
      return {
        running,
        gameOver,
        score,
        length: body.length,
        head: { ...body[0] },
        food: { ...food },
        dir
      };
    },
    setFood(x, y) {
      if (
        !Number.isInteger(x) || !Number.isInteger(y) ||
        x < 0 || x >= SIZE || y < 0 || y >= SIZE
      ) {
        throw new RangeError("Food coordinates must be integers from 0 to 19.");
      }
      food = { x, y };
      draw();
    }
  };

  reset();
  draw();
})();
</script>
</body>
</html>
