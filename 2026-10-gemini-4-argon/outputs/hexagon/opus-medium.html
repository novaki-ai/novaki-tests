<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balls in a Spinning Hexagon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0f1220;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 960px;
    height: 540px;
    background: radial-gradient(ellipse at center, #1c2238 0%, #0f1220 75%);
  }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
(() => {
  const W = 960, H = 540;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // HiDPI support
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ---- Simulation parameters ----
  const CX = W / 2, CY = H / 2;
  const HEX_R = 250;            // circumradius of hexagon
  const HEX_SPIN = 0.35;        // rad/s (positive = clockwise on screen)
  const GRAVITY = 900;          // px/s^2
  const AIR_DRAG = 0.05;        // per second, linear damping
  const SPIN_DRAG = 0.3;        // per second, angular damping
  const WALL_REST = 0.75;       // restitution against walls
  const BALL_REST = 0.88;       // restitution between balls
  const WALL_FRICTION = 0.25;   // Coulomb friction coefficient against walls
  const BALL_FRICTION = 0.08;   // friction between balls
  const REST_THRESHOLD = 25;    // below this normal speed, no bounce (kills jitter)
  const SUBSTEPS = 10;
  const BALL_ITER = 2;

  const COLORS = [
    '#ff5e5b', '#ffb84d', '#ffe156', '#8ce36b', '#3ddc97', '#2ec4b6',
    '#3a86ff', '#6f5cff', '#b15cff', '#ff5cc8', '#ff8fa3', '#c9d1d9'
  ];

  let hexAngle = 0;

  // ---- Balls ----
  const balls = [];
  function resetBalls() {
    balls.length = 0;
    const cols = 4, rows = 3, spacing = 46;
    let n = 1;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const radius = 17;
        const x = CX + (c - (cols - 1) / 2) * spacing + (Math.random() - 0.5) * 4;
        const y = CY - 60 + (r - (rows - 1) / 2) * spacing;
        balls.push({
          x, y,
          vx: (Math.random() - 0.5) * 300,
          vy: (Math.random() - 0.5) * 200,
          r: radius,
          m: radius * radius,          // mass ~ area
          I: 0.5 * radius * radius * radius * radius, // solid disc: 0.5*m*r^2
          ang: Math.random() * Math.PI * 2,
          w: 0,                        // angular velocity (rad/s)
          num: n,
          color: COLORS[n - 1]
        });
        n++;
      }
    }
  }
  resetBalls();

  // ---- Hexagon geometry ----
  function hexVertices(angle) {
    const v = [];
    for (let i = 0; i < 6; i++) {
      const a = angle + i * Math.PI / 3;
      v.push({ x: CX + HEX_R * Math.cos(a), y: CY + HEX_R * Math.sin(a) });
    }
    return v;
  }

  // Precompute inward normals for an angle
  function hexEdges(angle) {
    const v = hexVertices(angle);
    const edges = [];
    for (let i = 0; i < 6; i++) {
      const A = v[i], B = v[(i + 1) % 6];
      let ex = B.x - A.x, ey = B.y - A.y;
      const len = Math.hypot(ex, ey);
      ex /= len; ey /= len;
      let nx = -ey, ny = ex;
      // ensure normal points toward the centre
      if ((CX - A.x) * nx + (CY - A.y) * ny < 0) { nx = -nx; ny = -ny; }
      edges.push({ ax: A.x, ay: A.y, nx, ny });
    }
    return edges;
  }

  // ---- Collision: ball vs rotating wall ----
  function collideWalls(b, edges) {
    for (let k = 0; k < 6; k++) {
      const e = edges[k];
      const dist = (b.x - e.ax) * e.nx + (b.y - e.ay) * e.ny;
      if (dist >= b.r) continue;

      // Positional correction: push ball fully back inside
      const pen = b.r - dist;
      b.x += e.nx * pen;
      b.y += e.ny * pen;

      // Contact point on the wall (after correction)
      const cx = b.x - e.nx * b.r;
      const cy = b.y - e.ny * b.r;

      // Wall velocity at contact point (rigid rotation about centre)
      const wvx = -HEX_SPIN * (cy - CY);
      const wvy =  HEX_SPIN * (cx - CX);

      // Vector from ball centre to contact point
      const rcx = -e.nx * b.r, rcy = -e.ny * b.r;

      // Velocity of ball surface at contact point
      const pvx = b.vx - b.w * rcy;
      const pvy = b.vy + b.w * rcx;

      // Relative velocity (ball surface vs wall)
      const rvx = pvx - wvx, rvy = pvy - wvy;
      const vn = rvx * e.nx + rvy * e.ny;
      if (vn >= 0) continue; // separating

      // Normal impulse
      const rest = (-vn < REST_THRESHOLD) ? 0 : WALL_REST;
      const jn = -(1 + rest) * vn * b.m;
      b.vx += jn * e.nx / b.m;
      b.vy += jn * e.ny / b.m;

      // Tangential (friction) impulse with rolling
      const tx = -e.ny, ty = e.nx;
      const vt = rvx * tx + rvy * ty;
      const rcCrossT = rcx * ty - rcy * tx;
      const kT = 1 / b.m + (rcCrossT * rcCrossT) / b.I;
      let jt = -vt / kT;
      const maxJt = WALL_FRICTION * jn;
      if (jt > maxJt) jt = maxJt;
      if (jt < -maxJt) jt = -maxJt;
      b.vx += jt * tx / b.m;
      b.vy += jt * ty / b.m;
      b.w += (rcCrossT * jt) / b.I;
    }
  }

  // ---- Collision: ball vs ball ----
  function collideBalls() {
    const n = balls.length;
    for (let i = 0; i < n; i++) {
      const a = balls[i];
      for (let j = i + 1; j < n; j++) {
        const b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const minD = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minD * minD) continue;

        let d = Math.sqrt(d2);
        if (d < 1e-6) { dx = 1; dy = 0; d = 1e-6; } else { dx /= d; dy /= d; }
        const nx = dx, ny = dy;

        // Positional correction weighted by inverse mass
        const invA = 1 / a.m, invB = 1 / b.m, invSum = invA + invB;
        const pen = minD - d;
        a.x -= nx * pen * (invA / invSum);
        a.y -= ny * pen * (invA / invSum);
        b.x += nx * pen * (invB / invSum);
        b.y += ny * pen * (invB / invSum);

        // Contact offsets
        const rax = nx * a.r, ray = ny * a.r;
        const rbx = -nx * b.r, rby = -ny * b.r;

        // Surface velocities at contact
        const vax = a.vx - a.w * ray, vay = a.vy + a.w * rax;
        const vbx = b.vx - b.w * rby, vby = b.vy + b.w * rbx;
        const rvx = vbx - vax, rvy = vby - vay;
        const vn = rvx * nx + rvy * ny;
        if (vn >= 0) continue;

        const rest = (-vn < REST_THRESHOLD) ? 0 : BALL_REST;
        const jn = -(1 + rest) * vn / invSum;
        a.vx -= jn * nx * invA; a.vy -= jn * ny * invA;
        b.vx += jn * nx * invB; b.vy += jn * ny * invB;

        // Friction between balls
        const tx = -ny, ty = nx;
        const vt = rvx * tx + rvy * ty;
        const raT = rax * ty - ray * tx;
        const rbT = rbx * ty - rby * tx;
        const kT = invSum + (raT * raT) / a.I + (rbT * rbT) / b.I;
        let jt = -vt / kT;
        const maxJt = BALL_FRICTION * jn;
        if (jt > maxJt) jt = maxJt;
        if (jt < -maxJt) jt = -maxJt;
        a.vx -= jt * tx * invA; a.vy -= jt * ty * invA;
        b.vx += jt * tx * invB; b.vy += jt * ty * invB;
        a.w -= (raT * jt) / a.I;
        b.w += (rbT * jt) / b.I;
      }
    }
  }

  // ---- Step ----
  function step(dt) {
    const h = dt / SUBSTEPS;
    for (let s = 0; s < SUBSTEPS; s++) {
      hexAngle += HEX_SPIN * h;
      const edges = hexEdges(hexAngle);

      const drag = Math.exp(-AIR_DRAG * h);
      const sdrag = Math.exp(-SPIN_DRAG * h);
      for (const b of balls) {
        b.vy += GRAVITY * h;
        b.vx *= drag; b.vy *= drag;
        b.w *= sdrag;
        b.x += b.vx * h;
        b.y += b.vy * h;
        b.ang += b.w * h;
      }

      for (let it = 0; it < BALL_ITER; it++) {
        collideBalls();
        for (const b of balls) collideWalls(b, edges);
      }
      // Final containment pass so walls always win
      for (const b of balls) collideWalls(b, edges);
    }
  }

  // ---- Rendering ----
  function drawHexagon() {
    const v = hexVertices(hexAngle);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < 6; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.fill();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#5fa8ff';
    ctx.shadowColor = 'rgba(95,168,255,0.6)';
    ctx.shadowBlur = 16;
    ctx.stroke();
    ctx.restore();

    // Centre marker
    ctx.beginPath();
    ctx.arc(CX, CY, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
  }

  function drawBall(b) {
    ctx.save();
    ctx.translate(b.x, b.y);

    // Shadow-ish rim
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.4, b.r * 0.15, 0, 0, b.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.25, b.color);
    g.addColorStop(1, shade(b.color, -0.45));
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.stroke();

    // Rotating number disc
    ctx.rotate(b.ang);
    ctx.beginPath();
    ctx.arc(0, 0, b.r * 0.58, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.font = `bold ${Math.round(b.r * 0.85)}px system-ui, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(b.num), 0, 1);
    ctx.restore();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((f - r) * p + r);
    g = Math.round((f - g) * p + g);
    b = Math.round((f - b) * p + b);
    return `rgb(${r},${g},${b})`;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHexagon();
    for (const b of balls) drawBall(b);

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '13px system-ui, Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('Click to kick the balls  ·  R to reset', 14, 12);
  }

  // ---- Interaction ----
  canvas.addEventListener('mousedown', () => {
    for (const b of balls) {
      b.vx += (Math.random() - 0.5) * 700;
      b.vy -= 300 + Math.random() * 500;
    }
  });
  window.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') resetBalls();
  });

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 30) dt = 1 / 30; // avoid huge steps after tab switches
    step(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
