<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Balls in a Spinning Hexagon</title>
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center}
  canvas{background:#1b1e24;display:block}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, CX = W/2, CY = H/2;
const R = 250;              // hexagon circumradius
const OMEGA = 0.35;         // rad/s spin
const G = 900;              // gravity px/s^2
const AIR = 0.15;           // air drag per second
const REST_WALL = 0.75, REST_BALL = 0.9, MU = 0.15;
const BR = 16, N = 12;
let angle = 0;

const colors = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db',
                '#9b59b6','#e84393','#fd79a8','#00cec9','#a3cb38','#fdcb6e'];
const balls = [];
for (let i = 0; i < N; i++) {
  const a = i / N * Math.PI * 2, d = 60 + (i % 3) * 45;
  balls.push({x: CX + Math.cos(a)*d, y: CY + Math.sin(a)*d,
              vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300,
              r: BR, m: 1, n: i+1, c: colors[i], rot: 0, w: 0});
}

function hexVerts(a) {
  const v = [];
  for (let i = 0; i < 6; i++) {
    const t = a + i * Math.PI / 3;
    v.push({x: CX + R*Math.cos(t), y: CY + R*Math.sin(t)});
  }
  return v;
}

function collideWalls(b) {
  const v = hexVerts(angle);
  for (let i = 0; i < 6; i++) {
    const p1 = v[i], p2 = v[(i+1)%6];
    const ex = p2.x-p1.x, ey = p2.y-p1.y, len = Math.hypot(ex,ey);
    const tx = ex/len, ty = ey/len;
    // inward normal (toward centre)
    let nx = -ty, ny = tx;
    if ((CX-p1.x)*nx + (CY-p1.y)*ny < 0) { nx = -nx; ny = -ny; }
    const dist = (b.x-p1.x)*nx + (b.y-p1.y)*ny;
    if (dist < b.r) {
      // push back inside
      b.x += (b.r - dist) * nx; b.y += (b.r - dist) * ny;
      // wall velocity at contact point (rigid rotation)
      const cx = b.x - nx*b.r, cy = b.y - ny*b.r;
      const wvx = -OMEGA*(cy-CY), wvy = OMEGA*(cx-CX);
      const rvx = b.vx - wvx, rvy = b.vy - wvy;
      const vn = rvx*nx + rvy*ny;
      if (vn < 0) {
        const vt = rvx*tx + rvy*ty;
        const jn = -(1+REST_WALL)*vn;
        // Coulomb friction, limited so tangential slip doesn't reverse
        let jt = -vt;
        const maxT = MU*jn;
        if (Math.abs(jt) > maxT) jt = Math.sign(jt)*maxT;
        b.vx += jn*nx + jt*tx;
        b.vy += jn*ny + jt*ty;
        b.w = (vt + jt) / b.r;
      }
    }
  }
}

function collideBalls() {
  for (let i = 0; i < N; i++) for (let j = i+1; j < N; j++) {
    const a = balls[i], b = balls[j];
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy), min = a.r+b.r;
    if (d > 0 && d < min) {
      const nx = dx/d, ny = dy/d, ov = (min-d)/2;
      a.x -= nx*ov; a.y -= ny*ov; b.x += nx*ov; b.y += ny*ov;
      const rv = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
      if (rv < 0) {
        const j = -(1+REST_BALL)*rv / (1/a.m + 1/b.m);
        a.vx -= j*nx/a.m; a.vy -= j*ny/a.m;
        b.vx += j*nx/b.m; b.vy += j*ny/b.m;
        // light tangential friction
        const tx = -ny, ty = nx;
        const rt = (b.vx-a.vx)*tx + (b.vy-a.vy)*ty;
        const jt = Math.max(-MU*j, Math.min(MU*j, -rt/2)) * 0.5;
        a.vx -= jt*tx; a.vy -= jt*ty; b.vx += jt*tx; b.vy += jt*ty;
      }
    }
  }
}

// Hard safety clamp: guarantee every ball stays inside the hexagon's inscribed region
function contain(b) {
  const v = hexVerts(angle);
  for (let i = 0; i < 6; i++) {
    const p1 = v[i], p2 = v[(i+1)%6];
    const ex = p2.x-p1.x, ey = p2.y-p1.y, len = Math.hypot(ex,ey);
    let nx = -ey/len, ny = ex/len;
    if ((CX-p1.x)*nx + (CY-p1.y)*ny < 0) { nx = -nx; ny = -ny; }
    const dist = (b.x-p1.x)*nx + (b.y-p1.y)*ny;
    if (dist < b.r) { b.x += (b.r-dist)*nx; b.y += (b.r-dist)*ny; }
  }
}

function step(dt) {
  angle += OMEGA*dt;
  const drag = Math.exp(-AIR*dt);
  for (const b of balls) {
    b.vy += G*dt;
    b.vx *= drag; b.vy *= drag;
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.rot += b.w*dt; b.w *= drag;
  }
  for (let k = 0; k < 3; k++) {
    collideBalls();
    for (const b of balls) collideWalls(b);
  }
  for (const b of balls) contain(b);
}

function draw() {
  ctx.clearRect(0,0,W,H);
  const v = hexVerts(angle);
  ctx.beginPath();
  v.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.closePath();
  ctx.fillStyle = '#242832'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#8fa3c7'; ctx.stroke();

  for (const b of balls) {
    ctx.save();
    ctx.translate(b.x,b.y);
    const g = ctx.createRadialGradient(-b.r*0.35,-b.r*0.35,2,0,0,b.r);
    g.addColorStop(0,'#fff'); g.addColorStop(0.25,b.c); g.addColorStop(1,'#000');
    ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
    ctx.rotate(b.rot);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0,0,b.r*0.55,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.n,0,1);
    ctx.restore();
  }
}

let last = performance.now();
function loop(now) {
  let dt = Math.min((now-last)/1000, 1/30);
  last = now;
  const sub = 8;
  for (let i = 0; i < sub; i++) step(dt/sub);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
