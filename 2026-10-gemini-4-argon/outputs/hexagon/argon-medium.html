<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinning Hexagon Physics</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #0b0e17;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas {
    width: 960px;
    height: 540px;
    background: radial-gradient(circle at center, #182036 0%, #0d111d 100%);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    border: 1px solid #263152;
    border-radius: 6px;
    display: block;
  }
</style>
</head>
<body>
<canvas id="sim" width="960" height="540"></canvas>
<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;
const CX = W / 2;
const CY = H / 2;

// Hexagon configuration
const HEX_RADIUS = 235;
const HEX_SIDES = 6;
const HEX_OMEGA = 0.48; // radians per second
let hexAngle = 0;

// Physics constants
const GRAVITY = 520;         // px / s^2
const AIR_DAMPING = 0.9994;  // per substep velocity retention
const ANGULAR_DAMPING = 0.9992;
const WALL_RESTITUTION = 0.78;
const WALL_FRICTION = 0.32;
const BALL_RESTITUTION = 0.84;
const BALL_FRICTION = 0.22;
const SUBSTEPS = 12;

// Pool ball colors for balls 1..12
const BALL_COLORS = [
  '#f5c518', // 1 Yellow
  '#1d63dc', // 2 Blue
  '#e53935', // 3 Red
  '#7b2cbf', // 4 Purple
  '#fb8500', // 5 Orange
  '#2a9d8f', // 6 Green
  '#8d2323', // 7 Maroon
  '#22272e', // 8 Black
  '#f5c518', // 9 Yellow stripe
  '#1d63dc', // 10 Blue stripe
  '#e53935', // 11 Red stripe
  '#7b2cbf'  // 12 Purple stripe
];

const balls = [];
const NUM_BALLS = 12;
const BALL_RADIUS = 21;

// Initialize 12 balls in a neat cluster near the center
(function initBalls() {
  const cols = 4;
  const spacing = BALL_RADIUS * 2.35;
  for (let i = 0; i < NUM_BALLS; i++) {
    const row = Math.floor(i / cols);
    const col = i % cols;
    const x = CX + (col - 1.5) * spacing + (row % 2 === 0 ? -6 : 6);
    const y = CY - 45 + (row - 1) * spacing;
    balls.push({
      id: i + 1,
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 160,
      vy: (Math.random() - 0.5) * 160,
      r: BALL_RADIUS,
      mass: 1,
      inertia: 0.5 * BALL_RADIUS * BALL_RADIUS,
      angle: (Math.random() - 0.5) * 0.6,
      omega: (Math.random() - 0.5) * 2,
      color: BALL_COLORS[i],
      striped: i >= 8
    });
  }
})();

function getHexVertices(angle) {
  const verts = [];
  for (let i = 0; i < HEX_SIDES; i++) {
    const a = angle + (i * Math.PI * 2) / HEX_SIDES;
    verts.push({
      x: CX + Math.cos(a) * HEX_RADIUS,
      y: CY + Math.sin(a) * HEX_RADIUS
    });
  }
  return verts;
}

function stepPhysics(dt) {
  const subDt = dt / SUBSTEPS;
  const apothem = HEX_RADIUS * Math.cos(Math.PI / HEX_SIDES);

  for (let s = 0; s < SUBSTEPS; s++) {
    hexAngle += HEX_OMEGA * subDt;
    const verts = getHexVertices(hexAngle);

    // Integrate forces and velocities
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      b.vy += GRAVITY * subDt;
      b.vx *= AIR_DAMPING;
      b.vy *= AIR_DAMPING;
      b.omega *= ANGULAR_DAMPING;

      b.x += b.vx * subDt;
      b.y += b.vy * subDt;
      b.angle += b.omega * subDt;
    }

    // Multiple constraint solver iterations per substep to prevent tunneling or escape
    for (let iter = 0; iter < 3; iter++) {
      // Ball-to-Ball collisions
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const b1 = balls[i];
          const b2 = balls[j];
          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const distSq = dx * dx + dy * dy;
          const minDist = b1.r + b2.r;

          if (distSq < minDist * minDist && distSq > 1e-8) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = minDist - dist;

            // Positional correction
            b1.x -= nx * overlap * 0.5;
            b1.y -= ny * overlap * 0.5;
            b2.x += nx * overlap * 0.5;
            b2.y += ny * overlap * 0.5;

            // Tangent vector
            const tx = -ny;
            const ty = nx;

            // Relative velocity at contact point
            const rvx = (b2.vx - b2.omega * b2.r * ty) - (b1.vx + b1.omega * b1.r * ty);
            const rvy = (b2.vy + b2.omega * b2.r * tx) - (b1.vy - b1.omega * b1.r * tx);

            const velAlongNormal = (b2.vx - b1.vx) * nx + (b2.vy - b1.vy) * ny;
            if (velAlongNormal < 0) {
              const jn = -(1 + BALL_RESTITUTION) * velAlongNormal / (1 / b1.mass + 1 / b2.mass);
              const impX = jn * nx;
              const impY = jn * ny;

              b1.vx -= impX / b1.mass;
              b1.vy -= impY / b1.mass;
              b2.vx += impX / b2.mass;
              b2.vy += impY / b2.mass;

              // Tangential friction & spin transfer
              const vt = rvx * tx + rvy * ty;
              const invMassTangential = (1 / b1.mass + 1 / b2.mass) +
                (b1.r * b1.r) / b1.inertia + (b2.r * b2.r) / b2.inertia;
              let jt = -vt / invMassTangential;
              const maxJt = BALL_FRICTION * jn;
              if (jt > maxJt) jt = maxJt;
              if (jt < -maxJt) jt = -maxJt;

              b1.vx -= (jt * tx) / b1.mass;
              b1.vy -= (jt * ty) / b1.mass;
              b2.vx += (jt * tx) / b2.mass;
              b2.vy += (jt * ty) / b2.mass;

              b1.omega -= (jt * b1.r) / b1.inertia;
              b2.omega -= (jt * b2.r) / b2.inertia;
            }
          }
        }
      }

      // Ball-to-Hexagon Wall constraints (half-plane inward normals)
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];

        for (let w = 0; w < HEX_SIDES; w++) {
          const p1 = verts[w];
          const p2 = verts[(w + 1) % HEX_SIDES];

          const ex = p2.x - p1.x;
          const ey = p2.y - p1.y;
          const edgeLen = Math.hypot(ex, ey);
          const tx = ex / edgeLen;
          const ty = ey / edgeLen;

          // Inward normal for clockwise/counter-clockwise winding (pointing toward center)
          let nx = -ty;
          let ny = tx;
          const toCenterX = CX - p1.x;
          const toCenterY = CY - p1.y;
          if (nx * toCenterX + ny * toCenterY < 0) {
            nx = -nx;
            ny = -ny;
          }

          // Signed distance from ball center to wall line (positive inside)
          const signedDist = (b.x - p1.x) * nx + (b.y - p1.y) * ny;

          if (signedDist < b.r) {
            const penetration = b.r - signedDist;
            b.x += nx * penetration;
            b.y += ny * penetration;

            // Contact point on the wall
            const cx = b.x - nx * b.r;
            const cy = b.y - ny * b.r;

            // Velocity of the rotating wall at the contact point: v = omega x r
            const rx = cx - CX;
            const ry = cy - CY;
            const wallVx = -HEX_OMEGA * ry;
            const wallVy = HEX_OMEGA * rx;

            // Relative velocity of ball center wrt wall contact point
            const relVx = b.vx - wallVx;
            const relVy = b.vy - wallVy;

            const vn = relVx * nx + relVy * ny;
            if (vn < 0) {
              // Normal impulse
              const restitution = Math.abs(vn) < 18 ? 0.0 : WALL_RESTITUTION;
              const jn = -(1 + restitution) * vn * b.mass;

              b.vx += (jn / b.mass) * nx;
              b.vy += (jn / b.mass) * ny;

              // Tangential relative velocity at the contact surface including ball spin
              // Surface velocity of ball at contact point (-nx*r, -ny*r):
              // v_surf = v_ball + omega x (-n * r)
              const surfVx = b.vx + b.omega * b.r * ny;
              const surfVy = b.vy - b.omega * b.r * nx;
              const relSurfVx = surfVx - wallVx;
              const relSurfVy = surfVy - wallVy;

              const vt = relSurfVx * tx + relSurfVy * ty;
              const effMassT = (1 / b.mass) + (b.r * b.r) / b.inertia;
              let jt = -vt / effMassT;

              const maxJt = WALL_FRICTION * jn;
              if (jt > maxJt) jt = maxJt;
              if (jt < -maxJt) jt = -maxJt;

              b.vx += (jt / b.mass) * tx;
              b.vy += (jt / b.mass) * ty;

              // Torque from tangential impulse at r_contact = -n * b.r
              // r_contact x (jt * t) = (-nx*r)*(jt*ty) - (-ny*r)*(jt*tx)
              const torque = b.r * jt * (ny * tx - nx * ty);
              b.omega += torque / b.inertia;
            }
          }
        }

        // Strict safety clamp: ensure ball center is always inside all 6 half-planes
        for (let w = 0; w < HEX_SIDES; w++) {
          const midAngle = hexAngle + ((w + 0.5) * Math.PI * 2) / HEX_SIDES;
          const outNx = Math.cos(midAngle);
          const outNy = Math.sin(midAngle);
          const proj = (b.x - CX) * outNx + (b.y - CY) * outNy;
          const maxProj = apothem - b.r;
          if (proj > maxProj) {
            const diff = proj - maxProj;
            b.x -= outNx * diff;
            b.y -= outNy * diff;
          }
        }
      }
    }
  }
}

function drawHexagon(angle) {
  const verts = getHexVertices(angle);

  ctx.save();
  // Outer glow
  ctx.beginPath();
  for (let i = 0; i < verts.length; i++) {
    if (i === 0) ctx.moveTo(verts[i].x, verts[i].y);
    else ctx.lineTo(verts[i].x, verts[i].y);
  }
  ctx.closePath();

  ctx.fillStyle = 'rgba(15, 22, 38, 0.75)';
  ctx.fill();

  ctx.lineJoin = 'round';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#38bdf8';
  ctx.shadowColor = '#0ea5e9';
  ctx.shadowBlur = 18;
  ctx.stroke();

  // Crisp inner highlight line
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#e0f2fe';
  ctx.shadowBlur = 0;
  ctx.stroke();

  // Corner pins
  for (let i = 0; i < verts.length; i++) {
    ctx.beginPath();
    ctx.arc(verts[i].x, verts[i].y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#bae6fd';
    ctx.fill();
  }
  ctx.restore();
}

function drawBall(b) {
  ctx.save();
  ctx.translate(b.x, b.y);

  // Drop shadow
  ctx.beginPath();
  ctx.arc(2, 4, b.r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fill();

  // Rotate for ball spin
  ctx.rotate(b.angle);

  // Clip to ball circle
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, Math.PI * 2);
  ctx.clip();

  if (b.striped) {
    // Ivory base for striped balls (9..12)
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);

    // Colored stripe band
    ctx.fillStyle = b.color;
    ctx.fillRect(-b.r, -b.r * 0.56, b.r * 2, b.r * 1.12);
  } else {
    // Solid colored base (1..8)
    ctx.fillStyle = b.color;
    ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);
  }

  // White number circle badge
  ctx.beginPath();
  ctx.arc(0, 0, b.r * 0.46, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  // Number text
  ctx.fillStyle = '#0f172a';
  ctx.font = `700 ${Math.round(b.r * 0.54)}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(b.id), 0, 0.5);

  ctx.restore();

  // Spherical 3D shading & specular highlight (unrotated so light comes from top-left)
  ctx.save();
  ctx.translate(b.x, b.y);

  const grad = ctx.createRadialGradient(
    -b.r * 0.35, -b.r * 0.35, b.r * 0.08,
    0, 0, b.r
  );
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.38)');
  grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.0)');
  grad.addColorStop(0.75, 'rgba(0, 0, 0, 0.08)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0.45)');

  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.stroke();

  ctx.restore();
}

let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;

  stepPhysics(dt);

  ctx.clearRect(0, 0, W, H);

  // Subtle center axis marker
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
  ctx.fill();
  ctx.restore();

  drawHexagon(hexAngle);

  for (let i = 0; i < balls.length; i++) {
    drawBall(balls[i]);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
