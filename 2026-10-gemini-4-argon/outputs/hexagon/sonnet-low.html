<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Balls in a spinning hexagon</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1118; display: flex; align-items: center; justify-content: center; }
  canvas { width: 960px; height: 540px; background: #151a24; display: block; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 960, H = 540, CX = W / 2, CY = H / 2;

  const R = 255;                       // hexagon circumradius
  const APO = R * Math.cos(Math.PI / 6); // apothem (centre-to-wall distance)
  const OMEGA = 0.35;                  // hexagon angular speed (rad/s)
  const G = 900;                       // gravity (px/s^2)
  const BALL_R = 20;
  const N = 12;
  const E_WALL = 0.78, E_BALL = 0.9;
  const AIR = 0.12;                    // air drag (1/s)
  const WALL_FRICTION = 0.12;          // tangential loss per wall impact
  const SUBSTEPS = 10;

  const colors = ['#e6194b','#f58231','#ffe119','#bfef45','#3cb44b','#42d4f4',
                  '#4363d8','#911eb4','#f032e6','#a9a9a9','#9a6324','#fabed4'];

  let rot = 0;
  const balls = [];
  for (let i = 0; i < N; i++) {
    const col = i % 4, row = Math.floor(i / 4);
    const a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 200;
    balls.push({
      x: CX + (col - 1.5) * 52 + (Math.random() - 0.5) * 4,
      y: CY + (row - 1) * 52 + (Math.random() - 0.5) * 4,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      ang: Math.random() * 6.28, w: 0,
      r: BALL_R, color: colors[i], n: i + 1
    });
  }

  function collideWalls(b) {
    for (let i = 0; i < 6; i++) {
      const a = rot + i * Math.PI / 3 + Math.PI / 6;
      const nx = Math.cos(a), ny = Math.sin(a);       // outward normal
      const px = b.x - CX, py = b.y - CY;
      const d = APO - (px * nx + py * ny);            // distance to wall
      if (d < b.r) {
        // push back inside
        const pen = b.r - d;
        b.x -= nx * pen; b.y -= ny * pen;
        // wall velocity at the ball's position (rigid rotation)
        const wvx = -OMEGA * py, wvy = OMEGA * px;
        let rvx = b.vx - wvx, rvy = b.vy - wvy;
        const vn = rvx * nx + rvy * ny;
        if (vn > 0) {
          rvx -= (1 + E_WALL) * vn * nx;
          rvy -= (1 + E_WALL) * vn * ny;
          // tangential friction
          const tx = -ny, ty = nx;
          let vt = rvx * tx + rvy * ty;
          const dvt = vt * WALL_FRICTION;
          rvx -= dvt * tx; rvy -= dvt * ty;
          vt -= dvt;
          b.w += (vt / b.r - b.w) * 0.3;              // spin picks up from sliding
        }
        b.vx = rvx + wvx; b.vy = rvy + wvy;
      }
    }
  }

  function collideBalls() {
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const a = balls[i], b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const min = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;
        let d = Math.sqrt(d2);
        if (d < 1e-6) { dx = 1; dy = 0; d = 1e-6; }
        const nx = dx / d, ny = dy / d;
        const pen = (min - d) / 2;
        a.x -= nx * pen; a.y -= ny * pen;
        b.x += nx * pen; b.y += ny * pen;
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const j_ = -(1 + E_BALL) * vn / 2;          // equal masses
          a.vx -= j_ * nx; a.vy -= j_ * ny;
          b.vx += j_ * nx; b.vy += j_ * ny;
          // slight tangential friction -> spin exchange
          const tx = -ny, ty = nx;
          const vt = rvx * tx + rvy * ty;
          a.w += vt * 0.002; b.w += vt * 0.002;
        }
      }
    }
  }

  function step(dt) {
    rot += OMEGA * dt;
    const drag = Math.exp(-AIR * dt);
    for (const b of balls) {
      b.vy += G * dt;
      b.vx *= drag; b.vy *= drag;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 1800) { b.vx *= 1800 / sp; b.vy *= 1800 / sp; }
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.ang += b.w * dt;
      b.w *= Math.exp(-0.4 * dt);
    }
    for (let k = 0; k < 3; k++) {
      collideBalls();
      for (const b of balls) collideWalls(b);
    }
    // final safety: hard clamp inside the hexagon
    for (const b of balls) {
      for (let i = 0; i < 6; i++) {
        const a = rot + i * Math.PI / 3 + Math.PI / 6;
        const nx = Math.cos(a), ny = Math.sin(a);
        const d = APO - ((b.x - CX) * nx + (b.y - CY) * ny);
        if (d < b.r) { b.x -= nx * (b.r - d); b.y -= ny * (b.r - d); }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // hexagon
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = rot + i * Math.PI / 3;
      const x = CX + R * Math.cos(a), y = CY + R * Math.sin(a);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = '#1b2230';
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#7fa6ff';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // balls
    for (const b of balls) {
      const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.25, b.color);
      g.addColorStop(1, shade(b.color, 0.55));
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.stroke();

      // number on a small white disc, rotating with the ball
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.ang);
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.n, 0, 1);
      ctx.restore();
    }
  }

  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return `rgb(${r * f | 0},${g * f | 0},${b * f | 0})`;
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 30) dt = 1 / 30;
    const h = dt / SUBSTEPS;
    for (let i = 0; i < SUBSTEPS; i++) step(h);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
