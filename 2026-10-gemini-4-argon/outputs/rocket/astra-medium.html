<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Launch</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030712;
    display: grid;
    place-items: center;
  }
  canvas {
    display: block;
    width: min(100vw, 177.7778vh);
    height: auto;
    aspect-ratio: 16 / 9;
  }
</style>
</head>
<body>
<canvas id="scene" width="960" height="540"
  role="img" aria-label="A repeating nighttime rocket launch with a three-second countdown, flames, smoke, and liftoff."></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const W = 960, H = 540, LOOP = 10;
  const TAU = Math.PI * 2;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const smooth = v => { v = clamp(v); return v * v * (3 - 2 * v); };

  let seed = 72519;
  function random() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  const stars = Array.from({ length: 175 }, () => ({
    x: random() * W, y: random() * 418,
    r: .4 + random() * 1.1,
    phase: random() * TAU, alpha: .25 + random() * .65
  }));

  const smoke = Array.from({ length: 210 }, (_, i) => ({
    born: 3 + i / 75,
    side: random() < .5 ? -1 : 1,
    speed: 25 + random() * 62,
    rise: 7 + random() * 22,
    size: 8 + random() * 15,
    life: 2.2 + random() * 2.2,
    phase: random() * TAU,
    shade: Math.floor(115 + random() * 55)
  }));

  const exhaust = Array.from({ length: 170 }, (_, i) => ({
    born: 3.12 + i / 46,
    spread: (random() - .5) * 30,
    speed: 60 + random() * 95,
    size: 5 + random() * 12,
    life: .55 + random() * .7
  }));

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function ellipse(x, y, rx, ry, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    ctx.fill();
  }

  function glow(x, y, radius, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(255,130,35,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
  }

  function altitude(t) {
    const u = Math.max(0, t - 4);
    return 44 * u * u + 8 * u * u * u;
  }

  function background(t) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#040918");
    sky.addColorStop(.65, "#101c38");
    sky.addColorStop(1, "#28334a");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const a = s.alpha * (.76 + .24 * Math.sin(t * TAU / LOOP * 3 + s.phase));
      ellipse(s.x, s.y, s.r, s.r, `rgba(216,234,255,${a})`);
    }

    const moon = ctx.createRadialGradient(784, 94, 8, 784, 94, 75);
    moon.addColorStop(0, "rgba(167,199,240,.13)");
    moon.addColorStop(1, "rgba(167,199,240,0)");
    ctx.fillStyle = moon;
    ctx.fillRect(709, 19, 150, 150);
    ellipse(784, 94, 23, 23, "#c7d7e9");
    ellipse(792, 87, 21, 21, "#10192d");

    ctx.fillStyle = "#111b2b";
    ctx.beginPath();
    ctx.moveTo(0, 446);
    [[0,405],[80,379],[142,406],[222,363],[305,407],[365,385],
     [445,416],[545,378],[617,409],[714,369],[805,412],[890,385],[960,407]]
      .forEach(([x,y]) => ctx.lineTo(x,y));
    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.fill();

    ctx.fillStyle = "#0a111e";
    ctx.fillRect(0, 446, W, 94);
    ctx.fillStyle = "#182337";
    ctx.fillRect(0, 447, W, 2);

    // Launch tower.
    ctx.strokeStyle = "#26374b";
    ctx.lineWidth = 5;
    ctx.strokeRect(378, 292, 34, 152);
    ctx.lineWidth = 2;
    for (let y = 295; y < 431; y += 28) {
      ctx.beginPath();
      ctx.moveTo(380, y);
      ctx.lineTo(410, y + 28);
      ctx.moveTo(410, y);
      ctx.lineTo(380, y + 28);
      ctx.stroke();
    }
    ctx.fillStyle = "#32465b";
    ctx.fillRect(372, 287, 46, 7);
    ctx.fillRect(408, 341, 42 * (1 - smooth((t - 3.4) / .6)), 6);

    ellipse(395, 282, 3, 3, `rgba(255,89,94,${.6 + .4 * Math.cos(t * TAU)})`);

    // Pad and ground lights.
    ctx.fillStyle = "#27374a";
    ctx.beginPath();
    ctx.moveTo(420, 429);
    ctx.lineTo(540, 429);
    ctx.lineTo(563, 448);
    ctx.lineTo(397, 448);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#435168";
    ctx.fillRect(420, 425, 120, 5);
    ctx.fillStyle = "#080e18";
    ctx.fillRect(448, 435, 64, 13);

    for (const x of [180, 260, 340, 620, 700, 780]) {
      ellipse(x, 451, 3, 1.7, "#76cce0");
      ellipse(x, 452, 9, 3, "rgba(79,183,212,.08)");
    }

    ctx.fillStyle = "#687991";
    ctx.font = "10px monospace";
    ctx.textAlign = "left";
    ctx.fillText("PAD 07", 574, 440);
  }

  function drawGroundSmoke(t, front) {
    for (let i = 0; i < smoke.length; i++) {
      if ((i % 3 === 0) !== front) continue;
      const p = smoke[i];
      const age = t - p.born;
      if (age < 0 || age > p.life) continue;
      const growth = Math.sqrt(age);
      const x = 480 + p.side * (14 + age * p.speed);
      const y = 428 - age * p.rise + Math.sin(p.phase + age * 2) * 5;
      const radius = p.size + growth * 23;
      const alpha = .34 * smooth(age / .15) * (1 - smooth(age / p.life));
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0, `rgba(${p.shade},${p.shade + 8},${p.shade + 18},${alpha})`);
      g.addColorStop(.65, `rgba(115,132,153,${alpha * .75})`);
      g.addColorStop(1, "rgba(100,120,145,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }
  }

  function drawExhaust(t) {
    for (const p of exhaust) {
      const age = t - p.born;
      if (age < 0 || age > p.life) continue;
      const x = 480 + p.spread * (age + .2);
      const y = 422 - altitude(p.born) + age * p.speed;
      const fade = (1 - age / p.life) * .24;
      const r = p.size + age * 15;
      ellipse(x, y, r * .7, r,
        `rgba(192,201,212,${fade})`);
    }
  }

  function rocket(t) {
    const ignition = smooth((t - 3) / .6);
    const y = 416 - altitude(t);
    if (y < -180) return;

    ctx.save();
    ctx.translate(480 + (t >= 3 ? Math.sin(t * 69) * ignition * .5 : 0), y);

    if (ignition > 0) {
      const flicker = Math.sin(t * 73) * 8 + Math.sin(t * 117) * 5;
      const length = (49 + flicker + clamp(t - 4) * 28) * ignition;
      glow(0, 22, 80 * ignition, "rgba(255,137,41,.30)");
      const flame = ctx.createLinearGradient(0, -2, 0, length);
      flame.addColorStop(0, "#fffbe2");
      flame.addColorStop(.23, "#ffe389");
      flame.addColorStop(.6, "#ff922e");
      flame.addColorStop(1, "rgba(255,65,12,0)");
      ctx.fillStyle = flame;
      ctx.beginPath();
      ctx.moveTo(-10, -2);
      ctx.bezierCurveTo(-20, 22, -6, length * .75, 0, length);
      ctx.bezierCurveTo(8, length * .7, 20, 22, 10, -2);
      ctx.closePath();
      ctx.fill();
      ellipse(0, 13 * ignition, 5, 23 * ignition, "#fff6cf");
      ellipse(0, 1, 6, 7, "#d9f6ff");
    }

    // Swept fins.
    ctx.fillStyle = "#d95459";
    ctx.beginPath();
    ctx.moveTo(-15, -45);
    ctx.lineTo(-29, -10);
    ctx.lineTo(-29, 1);
    ctx.lineTo(-12, -8);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(15, -45);
    ctx.lineTo(29, -10);
    ctx.lineTo(29, 1);
    ctx.lineTo(12, -8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#536579";
    ctx.beginPath();
    ctx.moveTo(-10, -14);
    ctx.lineTo(-12, 1);
    ctx.lineTo(12, 1);
    ctx.lineTo(10, -14);
    ctx.fill();

    const body = ctx.createLinearGradient(-17, 0, 17, 0);
    body.addColorStop(0, "#8a9cae");
    body.addColorStop(.35, "#f1f5f5");
    body.addColorStop(.68, "#d5e0e6");
    body.addColorStop(1, "#7d91a6");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, -113);
    ctx.bezierCurveTo(-11, -101, -17, -87, -17, -70);
    ctx.lineTo(-15, -14);
    ctx.quadraticCurveTo(0, -9, 15, -14);
    ctx.lineTo(17, -70);
    ctx.bezierCurveTo(17, -87, 11, -101, 0, -113);
    ctx.fill();

    ctx.fillStyle = "#e36868";
    ctx.beginPath();
    ctx.moveTo(0, -113);
    ctx.quadraticCurveTo(-12, -99, -15, -85);
    ctx.quadraticCurveTo(0, -80, 15, -85);
    ctx.quadraticCurveTo(12, -99, 0, -113);
    ctx.fill();

    ellipse(0, -67, 10, 10, "#516c84");
    ellipse(0, -67, 7, 7, "#163958");
    ellipse(-2, -69, 3, 3, "#80cce0");

    ctx.fillStyle = "#db6165";
    ctx.fillRect(-15.7, -30, 31.4, 6);
    ctx.fillStyle = "#607589";
    ctx.font = "7px monospace";
    ctx.textAlign = "center";
    ctx.fillText("07", 0, -43);
    ctx.restore();
  }

  function overlay(t) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#a8bad3";
    ctx.font = "11px monospace";
    ctx.fillText("N I G H T   F L I G H T   /   0 7", 480, 43);

    if (t < 3) {
      const phase = t % 1;
      const opacity = smooth(phase / .1) * (1 - smooth((phase - .72) / .28));
      const scale = 1 + (1 - smooth(phase / .35)) * .18;
      ctx.save();
      ctx.translate(480, 181);
      ctx.scale(scale, scale);
      ctx.globalAlpha = opacity;
      ctx.strokeStyle = "rgba(159,199,232,.2)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, -5, 60, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = "#a7d9ed";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -5, 60, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - phase));
      ctx.stroke();
      ctx.fillStyle = "#edf8ff";
      ctx.shadowColor = "#7bcaff";
      ctx.shadowBlur = 22;
      ctx.font = "bold 82px sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText(String(3 - Math.floor(t)), 0, 0);
      ctx.restore();
    }

    const label = t < 3 ? "LAUNCH SEQUENCE"
      : t < 4 ? "IGNITION"
      : t < 7.4 ? "LIFTOFF"
      : "INTO THE NIGHT";
    ctx.font = "12px monospace";
    ctx.fillStyle = "#9cb0c9";
    ctx.fillText(label, 480, 500);

    const fade = 1 - smooth(t / .32);
    const endFade = smooth((t - 9.2) / .8);
    ctx.fillStyle = `rgba(3,7,18,${Math.max(fade, endFade)})`;
    ctx.fillRect(0, 0, W, H);
  }

  let start;
  function frame(now) {
    if (start === undefined) start = now;
    const t = ((now - start) / 1000) % LOOP;
    background(t);

    if (t >= 3 && t < 6.6) {
      const brightness = smooth((t - 3) / .25) * (1 - smooth((t - 4.3) / 2.3));
      ctx.save();
      ctx.globalAlpha = brightness;
      glow(480, 434, 150, "rgba(255,141,47,.29)");
      ellipse(480, 446, 80, 8, "rgba(255,162,63,.12)");
      ctx.restore();
    }

    drawGroundSmoke(t, false);
    drawExhaust(t);
    rocket(t);
    drawGroundSmoke(t, true);
    overlay(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
