<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Launch</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background: #030711;
  }
  canvas {
    display: block;
    width: min(100vw, 177.7778vh);
    height: auto;
    aspect-ratio: 16 / 9;
  }
</style>
</head>
<body>
<canvas id="scene" width="960" height="540"
  role="img" aria-label="A looping night rocket launch with a three, two, one countdown, fire, and smoke.">
</canvas>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const W = 960, H = 540, LOOP = 10;
  const TAU = Math.PI * 2;
  const clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
  const smooth = n => { n = clamp(n); return n * n * (3 - 2 * n); };
  const random = n => {
    const v = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return v - Math.floor(v);
  };
  const stars = Array.from({length: 150}, (_, i) => ({
    x: random(i + 1) * W,
    y: random(i + 401) * 436,
    r: .4 + random(i + 801) * 1.25,
    phase: random(i + 1201) * TAU
  }));

  function ellipse(x, y, rx, ry, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    ctx.fill();
  }

  function rocketY(t) {
    const flight = Math.max(0, t - 3.65);
    return 419 - 31 * flight * flight - 9 * flight * flight * flight;
  }

  function sky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#050b20");
    g.addColorStop(.65, "#10213d");
    g.addColorStop(1, "#23334a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const haze = ctx.createRadialGradient(530, 360, 5, 530, 360, 430);
    haze.addColorStop(0, "rgba(62,91,137,.12)");
    haze.addColorStop(1, "rgba(30,50,90,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);

    stars.forEach(s => {
      ctx.globalAlpha = .35 + .55 * (.5 + .5 * Math.sin(t * 1.5 + s.phase));
      ellipse(s.x, s.y, s.r, s.r, "#dfebff");
    });
    ctx.globalAlpha = 1;

    const moonGlow = ctx.createRadialGradient(783, 96, 10, 783, 96, 60);
    moonGlow.addColorStop(0, "rgba(190,216,255,.13)");
    moonGlow.addColorStop(1, "rgba(190,216,255,0)");
    ctx.fillStyle = moonGlow;
    ctx.fillRect(720, 33, 126, 126);
    ellipse(783, 96, 22, 22, "#b9cde0");
    ellipse(791, 89, 19, 20, "#101c34");

    ctx.fillStyle = "#0b1524";
    ctx.beginPath();
    ctx.moveTo(0, 457);
    for (let x = 0; x <= W; x += 40) {
      ctx.lineTo(x, 443 - random(x + 50) * 25);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.fill();
    ctx.fillStyle = "#080f1a";
    ctx.fillRect(0, 474, W, 66);
  }

  function pad(t) {
    const ignition = smooth((t - 2.65) / .55);
    const glow = ignition * (1 - smooth((t - 5.3) / 1.3));
    if (glow > 0) {
      const g = ctx.createRadialGradient(480, 456, 0, 480, 456, 190);
      g.addColorStop(0, `rgba(255,151,52,${glow * .3})`);
      g.addColorStop(1, "rgba(255,110,30,0)");
      ctx.fillStyle = g;
      ctx.fillRect(280, 270, 400, 270);
    }
    ctx.fillStyle = "#223044";
    ctx.fillRect(364, 449, 232, 13);
    ctx.fillStyle = "#111c2b";
    ctx.fillRect(354, 462, 252, 12);
    ctx.fillStyle = "#3f4d60";
    ctx.fillRect(364, 449, 232, 3);
    for (let x = 373; x < 590; x += 24) {
      ctx.fillStyle = "#aa8544";
      ctx.fillRect(x, 454, 11, 4);
    }

    // Service tower and cross braces.
    ctx.strokeStyle = "#35465a";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(399, 449); ctx.lineTo(399, 310);
    ctx.moveTo(425, 449); ctx.lineTo(425, 310);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let y = 315; y < 440; y += 25) {
      ctx.moveTo(399, y); ctx.lineTo(425, y + 25);
      ctx.moveTo(425, y); ctx.lineTo(399, y + 25);
    }
    ctx.stroke();
    ctx.fillStyle = "#42546b";
    ctx.fillRect(394, 306, 36, 7);
    ctx.fillRect(423, 339, 35 * (1 - smooth((t - 3.05) / .55)), 5);
    ellipse(412, 302, 3, 3, Math.sin(t * 5) > 0 ? "#ff5c56" : "#6c3034");

    for (const x of [351, 609]) {
      ctx.fillStyle = "#526277";
      ctx.fillRect(x - 1, 458, 2, 17);
      ellipse(x, 458, 3, 2, "#ffca72");
    }
  }

  function smoke(t) {
    // Particle positions are derived from loop time, ensuring a clean reset.
    for (let i = 0; i < 185; i++) {
      const born = 2.75 + i * .024;
      const age = t - born;
      if (age < 0 || age > 4.1) continue;
      const side = i % 2 ? 1 : -1;
      const ground = born < 4.45;
      const origin = Math.min(rocketY(born) + 25, 447);
      const spread = 29 + random(i + 40) * 49;
      const x = 480 + side * (age * spread + random(i + 80) * 13);
      const y = ground
        ? 452 - age * (10 + random(i + 90) * 20)
        : origin + age * 24;
      const radius = 6 + age * (14 + random(i + 180) * 8);
      const alpha = .29 * smooth(age / .18) * (1 - smooth(age / 4.1));
      const shade = ground ? 145 : 165;
      ellipse(x, y, radius * 1.35, radius,
        `rgba(${shade},${shade + 9},${shade + 20},${alpha})`);
    }
  }

  function flame(t, y) {
    if (t < 2.7 || y < -200) return;
    const power = smooth((t - 2.7) / .75);
    const flicker = 1 + .12 * Math.sin(t * 89) + .08 * Math.sin(t * 137);
    const length = (32 + 66 * smooth((t - 3.5) / .8)) * power * flicker;
    ctx.save();
    ctx.translate(480, y + 22);

    const halo = ctx.createRadialGradient(0, 17, 1, 0, 17, 100 * power + 1);
    halo.addColorStop(0, "rgba(255,167,63,.45)");
    halo.addColorStop(1, "rgba(255,99,20,0)");
    ctx.fillStyle = halo;
    ctx.fillRect(-110, -85, 220, 220);

    const g = ctx.createLinearGradient(0, 0, 0, length);
    g.addColorStop(0, "#fff8c5");
    g.addColorStop(.28, "#ffd15c");
    g.addColorStop(.65, "#ff762e");
    g.addColorStop(1, "rgba(255,57,15,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-10 * power, 0);
    ctx.bezierCurveTo(-21 * power, length * .35, -7, length * .73, 0, length);
    ctx.bezierCurveTo(10, length * .7, 20 * power, length * .3, 10 * power, 0);
    ctx.fill();
    ellipse(0, length * .23, 5 * power, length * .33, "#fff8dc");
    ctx.restore();
  }

  function rocket(t, y) {
    ctx.save();
    const shake = t > 2.7 && t < 4.2 ? Math.sin(t * 105) * .65 : 0;
    ctx.translate(480 + shake, y);
    // Fins.
    ctx.fillStyle = "#d45549";
    ctx.beginPath();
    ctx.moveTo(-13, -12); ctx.lineTo(-28, 19);
    ctx.lineTo(-27, 29); ctx.lineTo(-11, 19);
    ctx.moveTo(13, -12); ctx.lineTo(28, 19);
    ctx.lineTo(27, 29); ctx.lineTo(11, 19);
    ctx.fill();

    const body = ctx.createLinearGradient(-15, 0, 15, 0);
    body.addColorStop(0, "#879aaf");
    body.addColorStop(.35, "#f0f2ed");
    body.addColorStop(.65, "#d8e1e5");
    body.addColorStop(1, "#70869c");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-14, 18);
    ctx.lineTo(-14, -45);
    ctx.quadraticCurveTo(-12, -67, 0, -81);
    ctx.quadraticCurveTo(12, -67, 14, -45);
    ctx.lineTo(14, 18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#e06655";
    ctx.beginPath();
    ctx.moveTo(0, -81);
    ctx.quadraticCurveTo(-10, -69, -13, -54);
    ctx.lineTo(13, -54);
    ctx.quadraticCurveTo(10, -69, 0, -81);
    ctx.fill();

    ctx.fillStyle = "#b64d43";
    ctx.fillRect(-14, 2, 28, 7);
    ellipse(0, -34, 8, 8, "#61798d");
    ellipse(0, -34, 5.6, 5.6, "#102f4b");
    ellipse(-1.8, -36, 2, 2, "#8ee3f2");
    ctx.fillStyle = "#556477";
    ctx.beginPath();
    ctx.moveTo(-8, 18); ctx.lineTo(8, 18);
    ctx.lineTo(11, 24); ctx.lineTo(-11, 24);
    ctx.fill();
    ctx.restore();
  }

  function typography(t) {
    ctx.textAlign = "left";
    ctx.fillStyle = "#9bafc7";
    ctx.font = "11px system-ui, sans-serif";
    ctx.fillText("NIGHT FLIGHT / 01", 36, 36);
    ctx.fillStyle = "#60758e";
    ctx.fillText("LAUNCH SITE  •  00:00 UTC", 36, 54);

    if (t < 3) {
      const fraction = t % 1;
      const opacity = smooth(fraction / .12) * (1 - smooth((fraction - .74) / .26));
      ctx.save();
      ctx.translate(650, 230);
      ctx.scale(1 + .14 * (1 - fraction), 1 + .14 * (1 - fraction));
      ctx.globalAlpha = opacity;
      ctx.textAlign = "center";
      ctx.font = "700 112px system-ui, sans-serif";
      ctx.shadowColor = "#a9d9ff";
      ctx.shadowBlur = 25;
      ctx.fillStyle = "#e6f3ff";
      ctx.fillText(String(3 - Math.floor(t)), 0, 0);
      ctx.shadowBlur = 0;
      ctx.font = "11px system-ui, sans-serif";
      ctx.fillStyle = "#9cb5d0";
      ctx.fillText("T − MINUS", 0, 28);
      ctx.restore();
    }

    ctx.textAlign = "center";
    ctx.font = "11px system-ui, sans-serif";
    ctx.fillStyle = "#9bafc7";
    const label = t < 2.7 ? "AWAITING IGNITION"
      : t < 3.65 ? "ENGINE IGNITION"
      : t < 6.8 ? "LIFTOFF"
      : "TO THE STARS";
    ctx.fillText(label, 480, 511);
  }

  const start = performance.now();
  function frame(now) {
    const t = ((now - start) / 1000) % LOOP;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== W * dpr || canvas.height !== H * dpr) {
      canvas.width = W * dpr;
      canvas.height = H * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    sky(t);
    pad(t);
    flame(t, rocketY(t));
    smoke(t);
    rocket(t, rocketY(t));
    typography(t);

    // Fade out, reset behind black, then reveal the next countdown.
    const fade = Math.max(1 - smooth(t / .22), smooth((t - 9.35) / .65));
    if (fade > 0) {
      ctx.fillStyle = `rgba(3,7,17,${fade})`;
      ctx.fillRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
